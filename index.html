<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mooring Simulator</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { display: flex; height: 100vh; overflow: hidden; font-family: system-ui, sans-serif; }

    #palette {
      width: 120px;
      flex-shrink: 0;
      background: #1a2533;
      border-right: 1px solid #2d4a6b;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 8px;
      gap: 16px;
    }

    #palette h3 {
      color: #7ab5d4;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .boat-icon {
      cursor: grab;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 10px 8px;
      border: 1px solid #2d4a6b;
      border-radius: 6px;
      background: #0f1c2b;
      width: 100%;
      user-select: none;
      transition: border-color 0.15s, background 0.15s;
    }

    .boat-icon:hover {
      border-color: #7ab5d4;
      background: #152333;
    }

    .boat-icon img {
      width: 36px;
      height: 54px;
      object-fit: contain;
      filter: invert(1) brightness(1.5);
    }

    .boat-icon span {
      color: #7ab5d4;
      font-size: 11px;
    }

    canvas {
      flex: 1;
      display: block;
      cursor: crosshair;
    }
  </style>
</head>
<body>
  <aside id="palette">
    <h3>Boats</h3>
    <div class="boat-icon" draggable="true" data-type="monohull">
      <img src="/boats/monohull.svg" alt="Monohull">
      <span>Monohull</span>
    </div>
    <div class="boat-icon" draggable="true" data-type="catamaran">
      <img src="/boats/catamaran.svg" alt="Catamaran">
      <span>Catamaran</span>
    </div>
  </aside>
  <canvas id="canvas"></canvas>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
